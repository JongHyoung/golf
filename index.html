<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>⛳ 99회 천하제일골프대회</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap');
:root{
  --g:#1e5c38;--g2:#2d7a50;--g3:#d4edda;
  --bg:#f2f6f2;--card:#fff;--border:#c6dbc8;
  --text:#1a2e1a;--sub:#5a7a5a;--red:#c0392b;
  --evc:#c8f0d4;--shadow:0 2px 12px rgba(30,92,56,.10);
}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Noto Sans KR',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;}
.hdr{background:var(--g);color:#fff;padding:14px 18px 10px;position:sticky;top:0;z-index:100;box-shadow:0 2px 8px rgba(0,0,0,.2);}
.hdr h1{font-size:17px;font-weight:700;}
.hdr p{font-size:11px;opacity:.7;margin-top:2px;}
.tabs{display:flex;background:#fff;border-bottom:2px solid var(--border);position:sticky;top:54px;z-index:99;}
.tab{flex:1;padding:10px 0;text-align:center;font-size:13px;font-weight:500;color:var(--sub);cursor:pointer;border-bottom:3px solid transparent;transition:.2s;}
.tab.on{color:var(--g);border-bottom-color:var(--g);font-weight:700;}
.pg{display:none;padding:12px;}
.pg.on{display:block;}
.card{background:var(--card);border-radius:12px;padding:14px;margin-bottom:12px;box-shadow:var(--shadow);border:1px solid var(--border);}
.ctitle{font-size:12px;font-weight:700;color:var(--sub);letter-spacing:.4px;margin-bottom:12px;}
/* 에버표 */
.twrap{overflow-x:auto;-webkit-overflow-scrolling:touch;}
table.et{border-collapse:collapse;width:100%;font-size:13px;}
table.et th,table.et td{border:1px solid var(--border);padding:6px 5px;text-align:center;white-space:nowrap;}
table.et thead th{background:var(--g);color:#fff;font-weight:700;font-size:12px;}
table.et thead th.thd{background:#145228;text-align:center;}
td.tn{text-align:center;padding:6px 5px;background:#eaf4ec!important;color:var(--g);font-weight:700;font-size:12px;}
td.ts{cursor:pointer;}td.ts:hover{background:#e8f5e9!important;}
td.tev{background:var(--evc)!important;cursor:pointer;font-weight:700;}td.tev:hover{background:#a5d6a7!important;}
td.tm{background:#f5f5f5!important;color:#bbb;font-size:11px;}
td.tavg{background:#d4edda!important;color:var(--g);font-weight:700;}
td.tever{background:var(--g)!important;color:#fff;font-weight:900;font-size:16px;}
td.tdiff{font-size:12px;font-weight:700;}
td.tdiff.p{color:var(--red);}td.tdiff.z{color:#c9a227;}
.dbtn{background:#fdecea;border:1px solid #f5c6c2;color:var(--red);font-size:11px;font-weight:700;cursor:pointer;padding:3px 7px;border-radius:5px;}
.dbtn:active{background:var(--red);color:#fff;}
.hint{background:var(--g3);border-radius:8px;padding:8px 12px;font-size:11px;color:var(--g);margin-bottom:10px;line-height:1.7;}
/* 입력 */
input[type=date],input[type=number]{width:100%;padding:10px 12px;border:1.5px solid var(--border);border-radius:8px;font-size:15px;font-family:'Noto Sans KR',sans-serif;color:var(--text);background:#fff;outline:none;transition:.2s;}
input:focus{border-color:var(--g);}
label{display:block;font-size:12px;font-weight:600;color:var(--sub);margin-bottom:5px;}
.mrow{display:flex;align-items:center;padding:10px 0;border-bottom:1px solid var(--border);}
.mrow:last-child{border-bottom:none;}
.mrow input[type=number]{width:90px;text-align:center;padding:8px 6px;}
.shint{font-size:11px;color:var(--sub);margin-top:3px;min-height:14px;}
.abl{font-size:10px;color:#bbb;margin-top:2px;}
.btn{width:100%;padding:13px;border:none;border-radius:10px;font-size:15px;font-weight:700;cursor:pointer;transition:.2s;font-family:'Noto Sans KR',sans-serif;margin-top:14px;}
.btng{background:var(--g);color:#fff;}
.btng:active{background:var(--g2);transform:scale(.98);}
/* 기록 */
.rf{display:flex;gap:6px;margin-bottom:10px;overflow-x:auto;padding-bottom:2px;}
.fb{padding:5px 13px;border-radius:18px;border:1.5px solid var(--border);font-size:13px;font-weight:500;cursor:pointer;white-space:nowrap;background:#fff;color:var(--sub);font-family:'Noto Sans KR',sans-serif;transition:.2s;}
.fb.on{background:var(--g);color:#fff;border-color:var(--g);}
.empty{text-align:center;padding:36px 0;color:var(--sub);font-size:14px;}
.toast{position:fixed;bottom:28px;left:50%;transform:translateX(-50%) translateY(16px);background:#222;color:#fff;padding:11px 22px;border-radius:22px;font-size:14px;opacity:0;transition:.3s;z-index:999;pointer-events:none;white-space:nowrap;}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0);}
</style>
</head>
<body>
<div class="hdr">
  <h1>⛳ 99회 천하제일골프대회</h1>
  <p>핸디(핸디캡) 자동계산 · 최근 5대회 평균−72 &nbsp;|&nbsp; v1.0</p>
</div>
<div class="tabs">
  <div class="tab on" onclick="go('ever')">에버표</div>
  <div class="tab" onclick="go('input')">입력</div>
  <div class="tab" onclick="go('rec')">기록</div>
</div>

<div id="pg-ever" class="pg on">
  <div class="hint">핸디 = 최근 참가 5대회 평균타수 − 72 · <span style="background:var(--evc);padding:1px 5px;border-radius:3px;font-weight:700;">초록셀</span> = 핸디 계산 포함</div>
  <div class="card">
    <div class="ctitle">📊 에버계산표</div>
    <div class="twrap" id="ever-wrap"></div>
  </div>
</div>

<div id="pg-input" class="pg">
  <div class="card">
    <div class="ctitle">대회 결과 입력</div>
    <label>대회 날짜</label>
    <input type="date" id="idate" style="margin-bottom:14px">
    <div id="minputs"></div>
    <button class="btn btng" onclick="saveRound()">저장 → 에버표 반영</button>
  </div>
</div>

<div id="pg-rec" class="pg">
  <div class="rf">
    <button class="fb on" onclick="setF('전체')">전체</button>
    <button class="fb" onclick="setF('이선용')">이선용</button>
    <button class="fb" onclick="setF('이종형')">이종형</button>
    <button class="fb" onclick="setF('김용태')">김용태</button>
  </div>
  <div id="rec-list"></div>
</div>

<div class="toast" id="toast"></div>

<script>
const PAR=72;
const MEMBERS=['이선용','이종형','김용태'];
const KEY='golf_v4';

const SEED=[
  {cid:'c01',date:'2024-01-01',scores:{이선용:100,이종형:81,김용태:91}},
  {cid:'c02',date:'2024-02-01',scores:{이선용:105,이종형:75,김용태:85}},
  {cid:'c03',date:'2024-03-01',scores:{이선용:95, 이종형:78,김용태:92}},
  {cid:'c04',date:'2024-04-01',scores:{이선용:92, 이종형:82,김용태:89}},
  {cid:'c05',date:'2024-05-01',scores:{이선용:96, 이종형:83,김용태:89}},
];

function load(){
  try{ const s=localStorage.getItem(KEY); if(s) return JSON.parse(s); }catch(e){}
  const d=JSON.parse(JSON.stringify(SEED));
  localStorage.setItem(KEY,JSON.stringify(d));
  return d;
}
function save(d){ localStorage.setItem(KEY,JSON.stringify(d)); }

function getEverInfo(member,contests){
  const played=contests
    .filter(c=>typeof c.scores[member]==='number')
    .sort((a,b)=>a.date.localeCompare(b.date));
  const r5=played.slice(-5);
  if(!r5.length) return {ever:null,avg:null,count:0,cids:new Set()};
  const avg=r5.reduce((s,c)=>s+c.scores[member],0)/r5.length;
  return {ever:Math.floor(avg-PAR), avg:+avg.toFixed(1), count:r5.length, cids:new Set(r5.map(c=>c.cid))};
}

// ── 삭제 (공통) ───────────────────────────────────────────
function delContest(cid){
  const d=load().filter(c=>c.cid!==cid);
  save(d);
  renderAll();
  showToast('대회 삭제됐습니다');
}

// ── 에버표 ────────────────────────────────────────────────
function renderEverTable(){
  const contests=load();
  const sorted=[...contests].sort((a,b)=>a.date.localeCompare(b.date));
  const evInfo={};
  MEMBERS.forEach(m=>{ evInfo[m]=getEverInfo(m,contests); });
  const colM=[...MEMBERS].sort((a,b)=>{
    const ea=evInfo[a].ever, eb=evInfo[b].ever;
    if(ea===null) return 1; if(eb===null) return -1; return ea-eb;
  });
  const everVals=colM.map(m=>evInfo[m].ever).filter(v=>v!==null);
  const best=everVals.length?Math.min(...everVals):null;

  let h='<table class="et"><thead><tr>';
  h+='<th class="thd">날짜</th>';
  colM.forEach((m,i)=>h+=`<th>${i===0?'🥇 ':''}${m}</th>`);
  h+='<th style="min-width:52px">삭제</th></tr></thead><tbody>';

  sorted.forEach(c=>{
    const isSeed=c.cid.startsWith('c0');
    const label=isSeed
      ? '<span style="color:#bbb;font-size:10px">(초기)</span>'
      : c.date.replace(/-/g,'/').replace(/^(\d{4})\/(\d{2})\/(\d{2})$/,'$1/$2/$3');
    h+=`<tr><td class="tn" style="text-align:center;">${label}</td>`;
    // 이 대회 직전까지의 핸디 계산 (이 대회 제외)
    const contestsBeforeThis = contests.filter(x=>x.cid!==c.cid);
    const preHandy={};
    MEMBERS.forEach(m=>{
      const ev=getEverInfo(m,contestsBeforeThis);
      preHandy[m]=ev.ever!==null?ev.ever:null;
    });

    // 참가자 네트스코어 계산 후 등수 산정
    const participants=colM.filter(m=>typeof c.scores[m]==='number'&&preHandy[m]!==null);
    const nets={};
    participants.forEach(m=>{ nets[m]=c.scores[m]-Math.floor(preHandy[m]); });
    const ranked=[...participants].sort((a,b)=>{
      if(nets[a]!==nets[b]) return nets[a]-nets[b];
      return preHandy[a]-preHandy[b]; // 동타면 핸디 낮은 순
    });

    colM.forEach(m=>{
      const sc=c.scores[m];
      if(typeof sc==='number'){
        const over=sc-PAR, os=over>=0?`+${over}`:`${over}`;
        const cls=evInfo[m].cids.has(c.cid)?'tev':'ts';
        // 등수 표시
        const rankIdx=ranked.indexOf(m);
        const rankStr=rankIdx===0?'🥇':rankIdx===1?'🥈':rankIdx===2?'🥉':(rankIdx+1)+'위';
        const handyStr=preHandy[m]!==null?`<span style="font-size:9px;color:#888">H:${Math.floor(preHandy[m])}</span>`:'';
        const netStr=nets[m]!==undefined?`<span style="font-size:9px;color:#555">N:${nets[m]}</span>`:'';
        h+=`<td class="${cls}" data-cid="${c.cid}" data-member="${m}">
          <div style="font-size:14px;font-weight:700">${sc} ${rankStr}</div>
          <div style="font-size:10px;color:#666">${os}&nbsp;${handyStr}&nbsp;${netStr}</div>
        </td>`;
      } else {
        h+=`<td class="tm">미참</td>`;
      }
    });
    h+=`<td style="padding:2px 4px;text-align:center">
      <button class="dbtn" data-cid="${c.cid}">삭제</button></td></tr>`;
  });

  // 평균
  h+=`<tr><td class="tn">평균</td>`;
  colM.forEach(m=>{ const e=evInfo[m]; h+=`<td class="tavg">${e.avg!==null?e.avg:'—'}</td>`; });
  h+=`<td></td></tr>`;
  // 에버
  h+=`<tr><td class="tn">핸디</td>`;
  colM.forEach(m=>{ const e=evInfo[m]; h+=`<td class="tever">${e.ever!==null?e.ever:'—'}</td>`; });
  h+=`<td></td></tr>`;
  // 1위대비
  if(best!==null){
    h+=`<tr><td class="tn" style="font-size:10px">1위대비</td>`;
    colM.forEach(m=>{
      const e=evInfo[m];
      if(e.ever===null){h+=`<td class="tdiff">—</td>`;return;}
      const diff=+(e.ever-best).toFixed(1);
      h+=diff===0?`<td class="tdiff z">🥇</td>`:`<td class="tdiff p">+${diff}</td>`;
    });
    h+=`<td></td></tr>`;
  }


  h+='</tbody></table>';
  document.getElementById('ever-wrap').innerHTML=h;

  // 이벤트: 삭제버튼
  document.querySelectorAll('#ever-wrap .dbtn').forEach(btn=>{
    btn.addEventListener('click',()=>delContest(btn.dataset.cid));
  });
  // 이벤트: 셀 클릭(수정)
  document.querySelectorAll('#ever-wrap td[data-cid]').forEach(td=>{
    if(td.dataset.member) td.addEventListener('click',()=>editCell(td.dataset.cid,td.dataset.member));
  });
}

function editCell(cid,member){
  const contests=load();
  const c=contests.find(x=>x.cid===cid);
  if(!c) return;
  const cur=c.scores[member];
  const v=prompt(`${member} (${c.date})\n현재: ${cur}타\n새 타수:`,cur);
  if(v===null) return;
  const n=parseInt(v);
  if(isNaN(n)||n<60||n>150){showToast('유효하지 않은 타수');return;}
  c.scores[member]=n;
  save(contests);
  renderAll();
  showToast('수정됐습니다');
}

// ── 입력 폼 ───────────────────────────────────────────────
function renderInputForm(){
  const contests=load();
  document.getElementById('minputs').innerHTML=MEMBERS.map((m,i)=>{
    const ev=getEverInfo(m,contests);
    return`<div class="mrow">
      <div style="flex:1">
        <div style="font-size:15px;font-weight:700">${m}</div>
        <div style="font-size:11px;color:var(--sub)">현재 에버 ${ev.ever!==null?ev.ever:'—'}</div>
      </div>
      <div>
        <input type="number" id="sc${i}" placeholder="타수" min="60" max="150" oninput="previewSc(${i})">
        <div class="shint" id="sh${i}"></div>
        <div class="abl">비워두면 미참가</div>
      </div>
    </div>`;
  }).join('');
}

function previewSc(i){
  const m=MEMBERS[i];
  const el=document.getElementById('sc'+i);
  const sh=document.getElementById('sh'+i);
  if(!el||!sh) return;
  const v=parseInt(el.value);
  if(!v||v<60){sh.textContent='';return;}
  const over=v-PAR, os=over>=0?`+${over}`:`${over}`;
  const tmp=[...load(),{cid:'tmp',date:'9999-01-01',scores:{[m]:v}}];
  const ev=getEverInfo(m,tmp);
  sh.textContent=`${os} · 예상 핸디 ${ev.ever!==null?Math.floor(ev.ever):ev.ever}`;
}

function saveRound(){
  const date=document.getElementById('idate').value;
  if(!date){showToast('날짜를 입력하세요');return;}
  const scores={};
  MEMBERS.forEach((m,i)=>{
    const el=document.getElementById('sc'+i);
    const v=parseInt(el?el.value:'');
    if(v>=60&&v<=150) scores[m]=v;
  });
  if(!Object.keys(scores).length){showToast('타수를 1명 이상 입력하세요');return;}
  const cid='r'+Date.now();
  const contests=load();
  contests.push({cid,date,scores});
  save(contests);
  MEMBERS.forEach((_,i)=>{
    const el=document.getElementById('sc'+i);
    const sh=document.getElementById('sh'+i);
    if(el) el.value='';
    if(sh) sh.textContent='';
  });
  showToast('저장 완료 ('+Object.keys(scores).join(', ')+')');
  renderAll();
  go('ever');
}

// ── 기록 탭 ───────────────────────────────────────────────
let curF='전체';
function setF(f){
  curF=f;
  document.querySelectorAll('.fb').forEach(b=>b.classList.toggle('on',b.textContent===f));
  renderRecords();
}

function renderRecords(){
  const contests=load()
    .filter(c=>!c.cid.startsWith('c0'))
    .sort((a,b)=>b.date.localeCompare(a.date));
  const visible=contests.filter(c=>curF==='전체'||typeof c.scores[curF]==='number');
  const el=document.getElementById('rec-list');
  if(!visible.length){
    el.innerHTML='<div class="empty">기록 없음</div>';
    return;
  }
  el.innerHTML='';
  visible.forEach(c=>{
    const d=c.date.replace(/^\d{4}-/,'').replace('-','/');
    const showM=curF==='전체'?MEMBERS.filter(m=>typeof c.scores[m]==='number'):[curF];
    const rows=showM.map(m=>{
      const sc=c.scores[m], over=sc-PAR, os=over>=0?`+${over}`:`${over}`;
      return`<div style="display:flex;align-items:center;padding:7px 0;border-bottom:1px solid #f0f0f0;">
        <div style="flex:1;font-size:14px;font-weight:600;padding-left:4px">${m}</div>
        <span style="font-size:18px;font-weight:900;color:var(--g);margin-right:4px">${sc}</span>
        <span style="font-size:11px;color:var(--sub);width:32px">${os}</span>
      </div>`;
    }).join('');
    const card=document.createElement('div');
    card.style.cssText='margin-bottom:10px;border:1px solid var(--border);border-radius:10px;overflow:hidden;';
    card.innerHTML=`<div style="background:var(--g);color:#fff;padding:8px 12px;display:flex;align-items:center;">
      <span style="font-size:13px;font-weight:700;flex:1">📅 ${d} 대회</span>
      <button data-cid="${c.cid}" style="background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.3);color:#fff;border-radius:6px;padding:3px 8px;font-size:11px;cursor:pointer;" class="rec-del-btn">삭제</button>
    </div><div style="padding:0 8px;background:#fff">${rows}</div>`;
    card.querySelector('.rec-del-btn').addEventListener('click',function(){
      delContest(this.dataset.cid);
    });
    el.appendChild(card);
  });
}

// ── 탭 전환 ───────────────────────────────────────────────
const PAGES=['ever','input','rec'];
function go(name){
  PAGES.forEach(p=>document.getElementById('pg-'+p).classList.toggle('on',p===name));
  document.querySelectorAll('.tab').forEach((t,i)=>t.classList.toggle('on',PAGES[i]===name));
  if(name==='input') renderInputForm();
}

function renderAll(){
  renderEverTable();
  renderRecords();
  if(document.getElementById('pg-input').classList.contains('on')) renderInputForm();
}

function showToast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg; t.classList.add('on');
  setTimeout(()=>t.classList.remove('on'),2400);
}

document.getElementById('idate').value=new Date().toISOString().split('T')[0];
renderAll();
</script>
</body>
</html>
